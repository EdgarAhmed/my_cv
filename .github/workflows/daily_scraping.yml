name: Daily Scraping Job

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraping:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip gnupg
        
        # Instalar Chrome desde repositorio oficial de Google
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Verificar instalación
        google-chrome --version
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        
        # Instalar dependencias principales
        pip install selenium pandas webdriver-manager lxml
        
        # Si tienes requirements.txt, también instálalo
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        
    - name: Run Python scraping script
      env:
        # Variables de entorno para Chrome en modo headless
        DISPLAY: :99
        PYTHONUNBUFFERED: 1
      run: |
        echo "📁 Directorio de trabajo: $(pwd)"
        echo "📁 Contenido del directorio scraping_web/:"
        ls -la scraping_web/
        
        echo "🚀 Iniciando scraping de ebooks de MediaMarkt..."
        
        # Crear directorio para resultados si no existe
        mkdir -p scraping_results
        
        # Ejecutar el script
        python scraping_web/scrip_ebooks_01.py
        
        echo "✅ Script ejecutado. Verificando resultados..."
        
        # Listar archivos generados
        echo "📄 Archivos generados:"
        ls -la scraping_results/ || echo "No hay resultados"
        
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: scraping-output
        path: |
          scraping_results/*.csv
          *.csv
        retention-days: 7
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ El scraping de MediaMarkt ha fallado"
        echo "Revisa los logs para más detalles"
        echo ""
        echo "Posibles causas:"
        echo "1. Problemas de conexión a MediaMarkt"
        echo "2. Cambios en la estructura HTML del sitio"
        echo "3. Timeout en la ejecución"
        echo "4. Falta de dependencias"
