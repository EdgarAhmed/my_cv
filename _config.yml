about_content: | # this will include new lines to allow paragraphs

  Hi, my name's Edgar and I'm a Business Analyst with a strong inclination toward data analytics. Since I decided to focus my career path in the data world, I have been lucky enough to work with consulting companies alongside a great number of fantastic people. I have worked at several companies, gaining teamwork and leadership skills.

  Although I believe I still have a long way to go and a lot to learn, I can say I am most skilled in <mark>Power BI</mark>, as it has been my daily tool for the last couple of years, and <mark>Eating Pizza</mark>.

  I feel really comfortable working with:
  - <mark>Python</mark>
  - <mark>SQL</mark>
  - other visualization tools such as <mark>Tableau</mark> and <mark>Looker Studio</mark>.

  

