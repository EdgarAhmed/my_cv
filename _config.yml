# About Section
about_profile_image: images/profile.jpg
about_content: |
  Hi, my name is Edgar and I'm a Business Analyst with a strong passion for data analytics. Since deciding to pursue a career in data, I have been fortunate to work with consulting companies alongside a great number of fantastic professionals. I have worked at several companies, where I gained strong teamwork and leadership skills.

  Although I believe I still have a long way to go and a lot to learn, I am most skilled in <mark>Power BI</mark>, as it has been my daily tool for the last couple of years. I adapt well to team environments and I am comfortable working in in-person, hybrid, or remote formats. I am open to relocation and eager to continue developing in this field.

  I feel very comfortable working with:

  <mark>Python</mark> and libraries such as "<strong>Pandas</strong>" and "<strong>NumPy</strong>". I also have some experience with web scraping using "<strong>BeautifulSoup</strong>" and "<strong>Selenium</strong>".

  <mark>SQL</mark> for data transformation and analysis.

  <mark>Tableau</mark> and <mark>Looker Studio</mark> for building professional, client-ready dashboards.

