  - title: "<strong>Experience</strong>"
    layout: list
    content:
      - layout: left
        title: Aliando
        link: https://aliando.com/
        company_logo: images/aliando.jpg
        sub_title: Power BI Consultant
        caption: October 2024 - Present
        quote: >
          My yellow brick road to data visualization. I'm the go-to consultant who brings data to life for my client through powerful, well-maintained Power BI dashboards.
        description: |
          I work directly with my client, juggling everything from daily dashboard maintenance to digging into the data for new insights. It's a really collaborative role! A fun highlight was spearheading our big move from Tableau to Power BI, which was a great adventure.

          Here's a peek at what I do:
          - Team up with my client to keep our dashboards running smoothly and evolve them as their needs change.
          - Turn complex data into clear stories that everyone can understand and use.
          - Take care of our Power BI environment, making sure it's accurate, fast, and helpful.
          - Act as the bridge between technical data and real-world business questions.

      - layout: left
        title: Jakala
        link: https://jakala.es/
        company_logo: images/jakala.jpg
        sub_title: BI Analyst
        caption: February 2024 - September 2024
        quote: >
          My first hands-on experience in the corporate world!
        description: |
          I will always have kind words for Jakala, as they gave me the chance to have my first hands-on experience
          in the corporate world and in this field. I ended up loving working in such an amazing environment.
          Here, I was introduced to my first clients and projects. During my time there,
          I worked on three different projects where I used a wide range of tools, such as Python, SQL, Looker Studio, Visual Studio Code, Tableau, and Power BI. It was like a bootcamp right after my previous bootcamp.

          Task and responsibilities include:
          - Designed dashboards in Power BI and Tableau.
          - Deliver final products with an extremely high level of detail and quality.
          - Transform and validate data with stakeholders.
          - Worked closely with stakeholders to define KPIs.

      - layout: left
        title: Universidad Francisco de Vitoria
        link: https://www.ufv.es/
        company_logo: images/ufv.jpg
        sub_title: Full Time Lecturer
        caption: September 2018 - August 2023
        quote: >
          Yeah, you read it right. For five years I was a lecturer at UFV, a private university located in Madrid.
        description: |
          For five years I was part of UFV, a private university located in Madrid. During that time, I taught diverse number of subjects related to health science. I had to do something well enough while speaking in front of large audiences, as a couple of universities invited me as a guest lecturer in Paris (Ecole d'Assas - 2020) and Vienna (St. Pölten University - 2022).

          Task and responsibilities include:
          - Prepared and delivered lectures for undergraduate students.
          - Designed curricula and supervised student projects.
          - Supported research activities within the faculty, especially students' final-year dissertations.

      - layout: left
        title: Clínica Fisanax
        company_logo: images/fisanax.jpg
        sub_title: Manager, Owner, and Administrator
        caption: 2021 - 2023
        quote: >
          As crazy as it might look I had my own private clinic for almost two years — surprising, I know!
        description: |
          I wanted to know what it felt like to be my own boss, and at the end of 2022 I took the reins of Fisanax, a small wellbeing clinic in Madrid. I was fortunate enough to grow it into a five-member team, working hand to hand with them every day to provide the best treatment we could deliver.

          Task and responsibilities:
          - Managed daily operations of the clinic
          - Oversaw financial and administrative tasks
          - Built strong relationships with patients and staff

  - title: "<strong>Education</strong>"
    layout: list
    content:
      - layout: left
        title: Data Analytics Bootcamp
        link: https://www.ironhack.com/es-en
        sub_title: IronHack | Madrid, Spain.
        caption: 2023
        company_logo: images/ironhack.png
        description: |
          After having a taste of what it was working as a physio I knew that was not the right field for me anymore. I started playing around with python and after getting really into it, I decided to enrol in a Data Analytics Bootcamp. I could get a broad knowledge in ETL processes, EDA, advanced statistics, and data visualization. I gained proficiency in Python, SQL, and tools like Power BI, Tableau, Excel, Google Sheets, and MongoDB, which served me greatly for my future jobs. Finally, after a long walkthrough I can say I found my right career path. During my training in the bootcamp, programming felt more as a hobby than a job. I do know I'm in the right path because I do not feel the dread on a Sunday evening knowing that tomorrow I have to go to work.

      - layout: left
        title: MSc. in International Development and Cooperation.
        link: https://www.comillas.edu/
        sub_title: Universidad Pontificia de Comillas | Madrid, Spain.
        company_logo: images/comillas.png
        caption: 2023
        description: |
          I like to define myself as curious, and one of the areas that always stood out for me was International Cooperation, being the reason I enrolled in a Master’s program. During the Master’s, I gained the necessary knowledge to understand the operations of both national and international organisations. I was particularly intrigued by and focused on impact finance and ethical and responsible investment. Although I did learn a lot in a field that I was really passionate about, I could not see myself working in this field, which is one of the reasons I ended up in the data world. I guess most of the time we learn through trial and error.

      - layout: left
        title: Bachelor (Honours) Degree Standard in Health Sciences (Physiotherapy).
        sub_title: Universidad Europea de Madrid | Madrid, Spain.
        caption: 2013
        company_logo: images/uem.jpg
        link: https://universidadeuropea.com/
        description: |
          Everyone has a first love, or a first passion but first does not mean the best or the right one for the rest of your life. This is what happened to me and with physiotherapy. I had a good time while studying it, it allowed me to go abroad several times which enriched me enormously but I knew it was not something I wanted to do the rest of my life.

  - title: "<strong>A bit more about me</strong>"
    layout: text
    content: |
      As with a lot of people, traveling is in my DNA, and I have taken as many opportunities as possible to do so while studying and working. During my Bachelor's Degree, I spent two whole semesters in Coventry (UK), studying at Coventry University (2011-12).
      Later, in 2013, I thought, "I have never seen the northern lights," so I did another semester at the University of Jyväskylä (Finland), where I ended up seeing them.
      I also volunteered three years in a row with a Spanish NGO and traveled with them to Ethiopia to assist the local population.
      I have many hobbies that I'm passionate about:

      - Cycling, running, and working out.
      - Gaming and reading.
      - Drinking a cheeky one with friends on the weekends (Not everything has to be exercise-related! There should be balance.)
      - Hiking during winter, as walking over the snow is therapeutic for me.

